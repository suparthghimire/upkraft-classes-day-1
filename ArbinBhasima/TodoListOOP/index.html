<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbin Todo List OOP</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./src/main.js" defer></script>
</head>
<body>
    <h1>Mine Todo List</h1>
    <div>
        <form id="todo-form">
            <input id="todo-input" pattern=".*\S.*" placeholder="Enter your todo..." required/>
            <button class="btn" type="submit">Add Todo</button>
            <button class="btn" id="clear-btn" type="button">Clear All</button>
        </form>
    </div>
    <ul id="todo-list"></ul>
</body>
</html>
