<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arbin's Todo List</title>
    <link rel="stylesheet" href="./style.css">
    <script defer src="./todo.js"></script>

  <body>
    <h1>Mine ToDo List</h1>
    <div>
      <form id="todo-form">

        <button class="btn" type="submit">Add todo</button>
      </form>
    </div>
    <ul id="todo-list">

        <p>This is my todo element</p>
      </li>
      <li id="todo-item">
        <p>This is my todo element</p>
      </li> -->
    </ul>
    <div class="action">
      <button id="clear-btn" class="btn" type="button">Clear Completed</button>
    </div>
  </body>
</html>
